[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mql5bot"
version = "1.0.0"
description = "Full-stack algorithmic trading system for MetaTrader 5: MQL5 Expert Advisor framework + Python quant toolkit (strategies, backtesting, optimisation, dashboards)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
live = ["MetaTrader5>=5.0.45"]
optimize = ["optuna>=3.0"]  # Phase D: optional deterministic TPE/Hyperband only
dev = ["pytest>=7.4", "httpx>=0.27"]  # httpx: FastAPI TestClient

[project.scripts]
mql5bot = "mql5bot.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["python"]
markers = [
    "bench: performance benchmark tests (measurement only; no absolute-speed assertions)",
]
