# AEGIS Factory gate policy — DEFAULTS = SPEC §10.4 Gate-1 + DECISIONS §4.12.
# Mission §21: thresholds come from the SPEC / documented research policy /
# this explicit file — never invented to make candidates pass.
# Every validation run hashes this file into config_hash.

policy_version: spec-10.4-defaults

gate2_backtest:
  min_trades: 200
  min_years: 3.0
  min_pf: 1.3
  max_dd_pct: 20.0
  max_top10_profit_share: 0.5
  min_positive_quarters_share: 0.6
  min_edge_to_cost: 3.0

gate3_costs:
  stress_cost_multiplier: 2.0
  require_profitable_under_stress: true

gate4_robustness:
  max_param_sensitivity_dd_ratio: 2.0

gate5_walk_forward:
  min_wfe: 0.0

gate6_cpcv_pbo:
  max_pbo: 0.5
  min_dsr_p: 0.90

gate7_monte_carlo:
  max_p05_dd_pct: 40.0

gate8_regime:
  require_positive_in_expected_regime: true

gate9_portfolio:
  max_correlation_with_book: 0.85
  max_marginal_heat_add: 0.10

gate10_shadow:
  min_weeks: 4
  min_trades: 30

gate11_demo:
  min_weeks: 4
  min_trades: 30

gate12_live_small:
  min_weeks: 8
  max_dd_since_start_pct: 10.0
