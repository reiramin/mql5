# AEGIS Factory gate policy — INTEGRATION-GATE FIXTURE (NOT production).
# Production thresholds live in factory/gates.yaml (spec-10.4-defaults)
# and are UNCHANGED.  This policy exists solely so the deterministic
# E2E fixture (tests/test_factory_e2e.py) can walk the real lifecycle
# on ~4 years of synthetic H1 data.  Mission §21: thresholds only ever
# come from an explicit policy file — this is that file, version-stamped
# and hash-bound into every fixture validation run's config_hash.
# WFE is defined here as OOS_PF − IS_PF (documented fixture definition).

policy_version: fixture-integration-gate-1.0

gate2_backtest:
  min_trades: 500
  min_years: 3.0
  min_pf: 1.0
  max_dd_pct: 15.0
  max_top10_profit_share: 0.6
  min_positive_quarters_share: 0.5
  min_edge_to_cost: 1.0

gate3_costs:
  stress_cost_multiplier: 2.0
  require_profitable_under_stress: true

gate4_robustness:
  max_param_sensitivity_dd_ratio: 3.0

gate5_walk_forward:
  min_wfe: 0.0              # WFE := OOS_PF − IS_PF (fixture definition)

gate6_cpcv_pbo:
  max_pbo: 0.5              # single pre-registered candidate ⇒ PBO = 0
  min_dsr_p: 0.50           # PSR vs SR*=0 (López de Prado), daily returns

gate7_monte_carlo:
  max_p05_dd_pct: 25.0      # trade-order shuffle, 200 seeded perms

gate8_regime:
  require_positive_in_expected_regime: true

gate9_portfolio:
  max_correlation_with_book: 0.95   # fixture has an empty book ⇒ 0.0
  max_marginal_heat_add: 0.20
