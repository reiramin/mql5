# AEGIS Factory migrations (mission §72: all schema changes via Alembic).
[alembic]
script_location = migrations
prepend_sys_path = python
# DB URL comes from AEGIS_FACTORY_DB (set by the store/CLI); fallback:
sqlalchemy.url = sqlite:///factory.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
